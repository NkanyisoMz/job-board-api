services:
  db:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_board_api_development

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .

    ports:
      - "3000:3000"

    environment:
      DB_HOST: db
      DATABASE_PASSWORD: postgres
      RAILS_ENV: development

    depends_on:
      - db

volumes:
  postgres_data:
